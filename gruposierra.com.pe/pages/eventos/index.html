<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Eventos y Lanzamientos Inmobiliarios — Grupo Sierra</title>
  <meta name="description" content="Participa en nuestros lanzamientos inmobiliarios, conferencias de inversión y eventos exclusivos de Grupo Sierra." />

  <!-- Open Graph / Redes Sociales -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Eventos Inmobiliarios — Grupo Sierra" />
  <meta property="og:description" content="Inscríbete en nuestros eventos presenciales y virtuales de inversión en lotes y bienes raíces." />
  <meta property="og:image" content="https://api.insoft.com.pe/sierra/web/inicio/slider2.webp" />

  <link rel="icon" type="image/x-icon" href="../../img/iconos/logito.png" />
  <link rel="apple-touch-icon" href="../../img/iconos/logito.png" />

  <!-- 1) Sistema responsive -->
  <link rel="stylesheet" href="../../assets/css/2fondoPrincipal.css?v=5.0" />
  <!-- Menú y Iconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />
  <link rel="stylesheet" href="../../includes/1menu.css?v=5.0" />
  <!-- 3) CSS de  grupoSierra -->
  <link rel="stylesheet" href="./eventos.css?v=5.0">
  <script src="./eventos.js?v=5.0" defer></script>

</head>

<!-- Aplicamos el fondo moderno reutilizable -->
<body class="fondo-principal">
  <!-- ------------------------------------Menu/Encabezado---------------------------------- -->
  <!-- Header -->
  <div id="header-placeholder"></div>
  <!-- ------------------------------------------------------------------------------------- -->

  
  <!-- ------------------------------------Todo el Cuerpo----------------------------------- -->
  <main id="inicio" class="gs-main">
    <!-- SECCIÓN DE EVENTOS -->
    <section class="eventos-section" aria-labelledby="eventos-title">
      <div class="eventos-container">
        <header class="eventos-header">
          <h1 id="eventos-title" class="eventos-title">Eventos Inmobiliarios</h1>
          <p class="eventos-sub">Regístrate y asegura tu cupo en nuestros lanzamientos, ferias y visitas guiadas.</p>
        </header>

        <!-- Grid -->
        <div id="eventos-grid" class="eventos-grid" role="list"></div>

        <!-- Estado vacío / mensajes -->
        <div id="eventos-empty" class="eventos-empty" hidden>
          No hay eventos programados por ahora.
        </div>
      </div>
    </section>

    <!-- MODAL: Inscripción -->
    <div id="modal-overlay" class="modal-overlay" hidden>
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <button class="modal-close" aria-label="Cerrar" id="modal-close">×</button>
        <h2 id="modal-title" class="modal-title">Inscripción al evento</h2>
        <p id="modal-subtitle" class="modal-subtitle"></p>

        <form id="form-inscripcion" class="modal-form" novalidate>
          <input type="hidden" name="evento_id" id="f_evento_id">

          <div class="form-row">
            <label for="f_nombre">Nombre *</label>
            <input type="text" id="f_nombre" name="nombre" required placeholder="Tu nombre completo">
          </div>

          <div class="form-row">
            <label for="f_apellido">Apellido *</label>
            <input type="text" id="f_apellido" name="apellido" required placeholder="Tu apellido">
          </div>

          <div class="form-row">
            <label for="f_dni">DNI *</label>
            <input type="text" id="f_dni" name="dni" maxlength="15" required placeholder="Número de documento">
          </div>

          <div class="form-row">
            <label for="f_telefono">Teléfono *</label>
            <input type="tel" id="f_telefono" name="telefono" required placeholder="Número de contacto">
          </div>

          <div class="form-row">
            <label for="f_correo">Correo electrónico *</label>
            <input type="email" id="f_correo" name="correo" required placeholder="tucorreo@ejemplo.com">
          </div>

          <!-- Solo si es de pago -->
          <div class="form-row" id="row_comprobante" hidden>
            <label for="f_comprobante_file">Adjuntar Comprobante de Pago (Yape / Transferencia) *</label>
            <input type="file" id="f_comprobante_file" name="comprobante_file" accept="image/*">
            <small class="hint">Selecciona la captura de pantalla o foto de tu comprobante.</small>
          </div>

          <!-- Mensaje de validación -->
          <p class="form-info" id="form-info"></p>

          <!-- 🔘 Botón de envío -->
          <div class="form-row" style="text-align:center; margin-top:16px;">
            <button type="submit" id="btn-inscribirme" class="btn-inscribirme">
              📝 Inscribirme
            </button>
          </div>
        </form>

      </div>
    </div>
  </main>
  <!-- ------------------------------------------------------------------------------------- -->


  <!-- --------------------------------Todo el Pie de Pagina-------------------------------- -->
  <!-- carga el header -->
  <script src="../../includes/1menu.js?v=5.0"></script>
  <!-- Footer -->
  <div id="footer-placeholder"></div>
  <!-- Loader del footer -->
  <script src="../../includes/2pie.js?v=5.0"></script>
  <!-- -------------------------------------------------------------------------------------- -->

</body>
</html>
